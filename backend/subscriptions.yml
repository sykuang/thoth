# 訂閱服務白名單 — Phase 6 (2026-06-15)
#
# 詳見 wiki [[personal-finance-transaction-category-taxonomy]] § 5.4 / § 5.5
#
# classifier 對每筆 txn 做 case-insensitive substring match desc against
# keywords. 命中即 is_subscription=1.
#
# 維護指南:
# - 每個 entry 是「品牌/服務名字面」(任何 desc 裡可能出現的字串)
# - 不必含完整商家名,「Netflix」就會匹配「Netflix Taiwan」「NETFLIX.COM」
# - 中文常用名也加 (麻布記帳會吐中文 desc)
# - 順序無關 (用 set match)
# - 加新 entry 不必動 code, 改完這檔 reload 即生效 (cache 在 module level)

